name: FilePilot beta release

on:
  push:
    branches: [main]
    paths:
      - ".github/workflows/filepilot-release.yml"
  workflow_dispatch:

permissions:
  contents: write

jobs:
  build-and-release:
    name: Build, verify, and publish installable beta APK
    runs-on: ubuntu-24.04
    timeout-minutes: 35
    steps:
      - name: Check out source
        uses: actions/checkout@v5

      - name: Set up Java 17
        uses: actions/setup-java@v5
        with:
          distribution: temurin
          java-version: "17"

      - name: Set up Android SDK
        uses: android-actions/setup-android@v3
        with:
          packages: platform-tools

      - name: Install Android SDK packages
        run: sdkmanager "platforms;android-36" "build-tools;36.0.0" "platform-tools"

      - name: Cache Gradle
        uses: actions/cache@v4
        with:
          path: |
            ~/.gradle/caches
            ~/.gradle/wrapper
          key: filepilot-release-gradle-${{ runner.os }}-${{ hashFiles('**/*.gradle*', '**/gradle.properties') }}
          restore-keys: |
            filepilot-release-gradle-${{ runner.os }}-

      - name: Download Gradle
        run: |
          curl --fail --location --retry 3 --output /tmp/gradle-8.13-bin.zip https://services.gradle.org/distributions/gradle-8.13-bin.zip
          unzip -q /tmp/gradle-8.13-bin.zip -d /tmp

      - name: Build production-package beta APK
        run: |
          # Unit tests and the debug variant run in the separate Android build workflow.
          /tmp/gradle-8.13/bin/gradle --no-daemon --max-workers=2 :app:assembleRelease

      - name: Verify release APK signature and package metadata
        shell: bash
        run: |
          set -euo pipefail
          APK="app/build/outputs/apk/release/app-release.apk"
          test -s "$APK"
          "$ANDROID_HOME/build-tools/36.0.0/apksigner" verify --verbose "$APK"
          "$ANDROID_HOME/build-tools/36.0.0/aapt" dump badging "$APK" | tee /tmp/filepilot-badging.txt
          grep -q "name='com.nexauren.filepilot'" /tmp/filepilot-badging.txt
          grep -q "launchable-activity:" /tmp/filepilot-badging.txt
          sha256sum "$APK"

      - name: Upload installable APK artifact
        uses: actions/upload-artifact@v4
        with:
          name: FilePilot-beta-release-APK
          path: app/build/outputs/apk/release/app-release.apk
          if-no-files-found: error
          retention-days: 30

      - name: Publish GitHub pre-release with direct APK asset
        env:
          GH_TOKEN: ${{ secrets.GITHUB_TOKEN }}
        shell: bash
        run: |
          set -euo pipefail
          TAG="v0.5.0-beta.1"
          APK="app/build/outputs/apk/release/app-release.apk"
          ASSET="FilePilot-0.5.0-beta.1.apk"
          cp "$APK" "$ASSET"
          NOTES="$(cat <<'EOF'
          FilePilot 0.5.0 Android beta — in-app viewers, improved home collections, and reworked navigation.

          New in this beta:
          - Built-in PDF reader using Android PdfRenderer for supported, readable PDFs.
          - In-app previews for common Android-decodable image formats.
          - In-app video player using VideoView and audio player using MediaPlayer with basic playback controls.
          - Plain-text viewer limited to the first 1 MB; other formats can be opened with compatible Android apps.
          - Home category tiles display the count and total file size found by a bounded recursive scan (up to 8,000 files and 8 levels).
          - Applications is now a dedicated installed-app collection with Launch when available, App info, and uninstall request; APK installer files remain in their own category.
          - Starred files are featured on the home screen, alongside shortcuts to Favorites and encrypted Safe Folder.
          - Navigation drawer is grouped into Navigation, Collections, and Tools & settings.
          - Existing file collections remain files-only; directories stay in Storage / All files.
          - Existing image/video thumbnail grid, Cleaner, Trash, Safe Folder, local heuristic security review, and English/Portuguese strings remain.

          Files by Google functions were researched as a UX reference. FilePilot uses original branding and implementation; this beta does NOT claim full feature parity.

          IMPORTANT — beta/testing limitations:
          - This APK uses the Android debug signing key for sideload testing and is NOT a production-store signing build.
          - PDF rendering, image formats, and audio/video playback depend on Android support, provider access, and readable files. Unsupported formats open with a compatible app.
          - Category size summaries are bounded scan estimates, not exact system disk-usage values.
          - The Share screen uses Android's Sharesheet; it is not a custom offline-transfer protocol.
          - Security review is heuristic, NOT a full antivirus. Keep Android/Google Play Protect enabled.
          - FilePilot Trash is app-private. Emptying Trash, clearing app data, or uninstalling can permanently remove its contents.
          - Safe Folder data may be unrecoverable if the PIN is forgotten; clearing app data or uninstalling may delete the vault.
          - Test with non-critical files on physical Android devices before relying on Trash or Safe Folder. Store launch requires policy review, privacy documentation, device testing, and a private production signing key.
          EOF
          )"
          if gh release view "$TAG" >/dev/null 2>&1; then
            gh release edit "$TAG" --title "FilePilot 0.5.0 Beta 1" --notes "$NOTES" --prerelease
            gh release upload "$TAG" "$ASSET" --clobber
          else
            gh release create "$TAG" "$ASSET" --target "$GITHUB_SHA" --title "FilePilot 0.5.0 Beta 1" --notes "$NOTES" --prerelease
          fi
          echo "Published release: https://github.com/nexauren1/File-pilot/releases/tag/$TAG"
