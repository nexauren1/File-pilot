name: FilePilot beta release

on:
  push:
    branches: [main]
    paths:
      - ".github/workflows/filepilot-release.yml"
  workflow_dispatch:

permissions:
  contents: write

jobs:
  build-and-release:
    name: Build, verify, and publish installable beta APK
    runs-on: ubuntu-24.04
    timeout-minutes: 35
    steps:
      - name: Check out source
        uses: actions/checkout@v5

      - name: Set up Java 17
        uses: actions/setup-java@v5
        with:
          distribution: temurin
          java-version: "17"

      - name: Set up Android SDK
        uses: android-actions/setup-android@v3
        with:
          packages: platform-tools

      - name: Install Android SDK packages
        run: sdkmanager "platforms;android-36" "build-tools;36.0.0" "platform-tools"

      - name: Cache Gradle
        uses: actions/cache@v4
        with:
          path: |
            ~/.gradle/caches
            ~/.gradle/wrapper
          key: filepilot-release-gradle-${{ runner.os }}-${{ hashFiles('**/*.gradle*', '**/gradle.properties') }}
          restore-keys: |
            filepilot-release-gradle-${{ runner.os }}-

      - name: Download Gradle
        run: |
          curl --fail --location --retry 3 --output /tmp/gradle-8.13-bin.zip https://services.gradle.org/distributions/gradle-8.13-bin.zip
          unzip -q /tmp/gradle-8.13-bin.zip -d /tmp

      - name: Build production-package beta APK
        run: |
          # Unit tests and the debug variant run in the separate Android build workflow.
          /tmp/gradle-8.13/bin/gradle --no-daemon --max-workers=2 :app:assembleRelease

      - name: Verify release APK signature and package metadata
        shell: bash
        run: |
          set -euo pipefail
          APK="app/build/outputs/apk/release/app-release.apk"
          test -s "$APK"
          "$ANDROID_HOME/build-tools/36.0.0/apksigner" verify --verbose "$APK"
          "$ANDROID_HOME/build-tools/36.0.0/aapt" dump badging "$APK" | tee /tmp/filepilot-badging.txt
          grep -q "name='com.nexauren.filepilot'" /tmp/filepilot-badging.txt
          grep -q "launchable-activity:" /tmp/filepilot-badging.txt
          sha256sum "$APK"

      - name: Upload installable APK artifact
        uses: actions/upload-artifact@v4
        with:
          name: FilePilot-beta-release-APK
          path: app/build/outputs/apk/release/app-release.apk
          if-no-files-found: error
          retention-days: 30

      - name: Publish GitHub pre-release with direct APK asset
        env:
          GH_TOKEN: ${{ secrets.GITHUB_TOKEN }}
        shell: bash
        run: |
          set -euo pipefail
          TAG="v0.4.0-beta.1"
          APK="app/build/outputs/apk/release/app-release.apk"
          ASSET="FilePilot-0.4.0-beta.1.apk"
          cp "$APK" "$ASSET"
          NOTES="$(cat <<'EOF'
          FilePilot 0.4.0 Android beta — redesigned file collections, navigation, and original visual identity.

          New in this beta:
          - Category views are file collections: folders are not shown inside Images, Videos, Audio, Documents, Downloads, Archives, APKs, and other typed collections.
          - Images and Videos use a two-column thumbnail grid. Image previews and video frames are generated locally when the Android storage provider supports them.
          - Folder navigation is separated into Storage / All files.
          - Refreshed home dashboard with a FilePilot brand panel, storage usage, category cards, recent files, Favorites, Safe Folder, and app-management access.
          - Reworked full navigation sheet separates Home, Storage, Clean, Share, recents, collections, tools, and settings.
          - Global processing bar and animated transitions for file operations, category loading, cleaner scans, and Safe Folder operations.
          - Original FilePilot adaptive launcher icon and custom vector illustrations for access guidance, empty states, and cleaner completion.
          - Cleaner recommendations for large files, exact duplicates, and APK installers; duplicate review preserves one copy per exact-match group.
          - Trash, app manager, local heuristic security review, encrypted Safe Folder, and native Android sharing remain available.
          - English and Portuguese labels for the refreshed screens.

          The interaction patterns use Google Files as a UX reference; FilePilot has its own name, icon artwork, colors, and code.

          IMPORTANT — beta/testing limitations:
          - This APK uses the Android debug signing key for sideload testing. It is NOT a production-store signing build.
          - The Share screen uses Android's available sharing targets; it is not a custom offline-transfer protocol.
          - Security review is heuristic and is NOT a full antivirus, does not use a malware-signature database, and cannot certify files as safe. Keep Android/Google Play Protect enabled.
          - FilePilot Trash stores deleted items inside app-private storage. Emptying Trash, clearing app data, or uninstalling FilePilot can permanently remove those items.
          - Safe Folder data may be unrecoverable if the PIN is forgotten; clearing app data or uninstalling may delete the vault.
          - Test with non-critical files on physical devices before relying on Trash or Safe Folder. Store launch requires policy review, privacy documentation, device testing, and a private production signing key.
          EOF
          )"
          if gh release view "$TAG" >/dev/null 2>&1; then
            gh release edit "$TAG" --title "FilePilot 0.4.0 Beta 1" --notes "$NOTES" --prerelease
            gh release upload "$TAG" "$ASSET" --clobber
          else
            gh release create "$TAG" "$ASSET" --target "$GITHUB_SHA" --title "FilePilot 0.4.0 Beta 1" --notes "$NOTES" --prerelease
          fi
          echo "Published release: https://github.com/nexauren1/File-pilot/releases/tag/$TAG"
