name: FilePilot beta release

on:
  push:
    branches: [main]
    paths:
      - ".github/workflows/filepilot-release.yml"
  workflow_dispatch:

permissions:
  contents: write

jobs:
  build-and-release:
    name: Build, verify, and publish installable beta APK
    runs-on: ubuntu-24.04
    timeout-minutes: 35
    steps:
      - name: Check out source
        uses: actions/checkout@v5

      - name: Set up Java 17
        uses: actions/setup-java@v5
        with:
          distribution: temurin
          java-version: "17"

      - name: Set up Android SDK
        uses: android-actions/setup-android@v3
        with:
          packages: platform-tools

      - name: Install Android SDK packages
        run: sdkmanager "platforms;android-36" "build-tools;36.0.0" "platform-tools"

      - name: Cache Gradle
        uses: actions/cache@v4
        with:
          path: |
            ~/.gradle/caches
            ~/.gradle/wrapper
          key: filepilot-release-gradle-${{ runner.os }}-${{ hashFiles('**/*.gradle*', '**/gradle.properties') }}
          restore-keys: |
            filepilot-release-gradle-${{ runner.os }}-

      - name: Download Gradle
        run: |
          curl --fail --location --retry 3 --output /tmp/gradle-8.13-bin.zip https://services.gradle.org/distributions/gradle-8.13-bin.zip
          unzip -q /tmp/gradle-8.13-bin.zip -d /tmp

      - name: Build production-package beta APK
        run: |
          # Unit tests and the debug variant run in the separate Android build workflow.
          /tmp/gradle-8.13/bin/gradle --no-daemon --max-workers=2 :app:assembleRelease

      - name: Verify release APK signature and package metadata
        shell: bash
        run: |
          set -euo pipefail
          APK="app/build/outputs/apk/release/app-release.apk"
          test -s "$APK"
          "$ANDROID_HOME/build-tools/36.0.0/apksigner" verify --verbose "$APK"
          "$ANDROID_HOME/build-tools/36.0.0/aapt" dump badging "$APK" | tee /tmp/filepilot-badging.txt
          grep -q "name='com.nexauren.filepilot'" /tmp/filepilot-badging.txt
          grep -q "launchable-activity:" /tmp/filepilot-badging.txt
          sha256sum "$APK"

      - name: Upload installable APK artifact
        uses: actions/upload-artifact@v4
        with:
          name: FilePilot-beta-release-APK
          path: app/build/outputs/apk/release/app-release.apk
          if-no-files-found: error
          retention-days: 30

      - name: Publish GitHub pre-release with direct APK asset
        env:
          GH_TOKEN: ${{ secrets.GITHUB_TOKEN }}
        shell: bash
        run: |
          set -euo pipefail
          TAG="v0.1.0-beta.1"
          APK="app/build/outputs/apk/release/app-release.apk"
          ASSET="FilePilot-0.1.0-beta.1.apk"
          cp "$APK" "$ASSET"
          NOTES="$(cat <<'EOF'
          FilePilot Android beta.

          This release is built for direct device testing. It includes categories, folder navigation, copy/move actions, Favorites, Recent files, and the encrypted Safe Folder.

          IMPORTANT: this beta APK uses the Android debug signing key for sideload testing. It is not a production Google Play signing build. Before a store launch, configure a private production keystore and re-test the Safe Folder and storage permissions on real devices.

          This is an early beta. Back up important files before using it; Safe Folder contents cannot be recovered if the PIN is forgotten, and clearing app data or uninstalling may delete the vault.
          EOF
          )"
          if gh release view "$TAG" >/dev/null 2>&1; then
            gh release edit "$TAG" --title "FilePilot 0.1.0 Beta 1" --notes "$NOTES" --prerelease
            gh release upload "$TAG" "$ASSET" --clobber
          else
            gh release create "$TAG" "$ASSET" --target "$GITHUB_SHA" --title "FilePilot 0.1.0 Beta 1" --notes "$NOTES" --prerelease
          fi
          echo "Published release: https://github.com/nexauren1/File-pilot/releases/tag/$TAG"
